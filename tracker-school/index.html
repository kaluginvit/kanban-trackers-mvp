<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduFlow — Трекер производства курсов (Онлайн-школа)</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273449;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --ok: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #ec4899); display: grid; place-items: center; font-weight: 800; font-size: 16px; }
    .brand h1 { font-size: 17px; font-weight: 700; }
    .brand span { font-size: 12px; color: var(--muted); display: block; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    select, input, button, textarea {
      font-family: inherit; font-size: 13px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); padding: 8px 12px;
    }
    button { background: var(--accent); border-color: var(--accent); cursor: pointer; font-weight: 600; }
    button:hover { background: var(--accent-hover); }
    button.ghost { background: transparent; border-color: var(--border); color: var(--text); }
    button.ghost:hover { background: var(--surface-2); }
    .stats-bar {
      display: flex; gap: 16px; padding: 12px 24px; background: #131c31; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 12px; }
    .stat strong { font-size: 16px; display: block; margin-top: 2px; color: #a5b4fc; }
    .board {
      display: grid; grid-template-columns: repeat(5, minmax(240px, 1fr)); gap: 14px;
      padding: 18px 24px; flex: 1; overflow-x: auto;
    }
    .col {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      display: flex; flex-direction: column; min-height: 460px;
    }
    .col-head {
      padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px;
    }
    .badge { background: var(--surface-2); padding: 2px 8px; border-radius: 999px; font-size: 11px; color: var(--muted); }
    .col-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
      cursor: pointer; transition: border-color .15s, transform .1s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .card-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; line-height: 1.35; }
    .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-top: 8px; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgba(99,102,241,.18); color: #c7d2fe; margin-right: 4px; }
    .tag.overdue { background: rgba(239,68,68,.2); color: #fca5a5; }
    .card-actions { display: flex; gap: 6px; margin-top: 10px; }
    .card-actions button { padding: 4px 8px; font-size: 11px; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(2,6,23,.75); display: none; place-items: center; padding: 16px; z-index: 50;
    }
    .modal-bg.open { display: grid; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 560px; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; }
    .comments { display: flex; flex-direction: column; gap: 8px; background: var(--bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
    .comment { font-size: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .comment:last-child { border-bottom: none; padding-bottom: 0; }
    .role-pill { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: rgba(16,185,129,.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">EF</div>
      <div>
        <h1>EduFlow — Конвейер уроков онлайн-школы</h1>
        <span>Курс: «Python & AI с нуля» • RBAC: доступ по ролям</span>
      </div>
    </div>
    <div class="controls">
      <span class="role-pill" id="roleBadge">Роль: Админ школы</span>
      <select id="roleSelect" title="Переключение роли">
        <option value="admin">Админ школы (все задачи)</option>
        <option value="curator">Куратор направления</option>
        <option value="expert">Эксперт (только свои уроки)</option>
        <option value="contractor">Подрядчик / Дизайнер</option>
      </select>
      <input type="text" id="searchInput" placeholder="Поиск по уроку или автору..." />
      <button id="addBtn">+ Новый урок</button>
    </div>
  </header>

  <div class="stats-bar" id="statsBar"></div>
  <main class="board" id="board"></main>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Карточка урока</h3>
        <button class="ghost" id="closeModal">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const STAGES = [
      { id: 'methodist', name: '1. Методист (ТЗ)' },
      { id: 'expert', name: '2. Эксперт (Съёмка)' },
      { id: 'editor', name: '3. Редактор (Монтаж)' },
      { id: 'design', name: '4. Дизайн (Обложки)' },
      { id: 'prod', name: '5. Продакшн (Готово)' }
    ];

    const INITIAL_TASKS = [
      {
        id: 1, title: 'Урок 1.1: Введение в AI-агентов', stage: 'prod',
        ownerRole: 'expert', assignee: 'Анна (Эксперт)', deadline: '2026-11-28',
        file: 'urok_1_1_final.mp4 (420 МБ)', overdue: false,
        comments: ['Методист: сценарий утверждён', 'Дизайнер: обложка и PDF-гайд приложены']
      },
      {
        id: 2, title: 'Урок 2.3: Промптинг и парсинг таблиц', stage: 'design',
        ownerRole: 'contractor', assignee: 'Игорь (Дизайнер)', deadline: '2026-11-25',
        file: 'maket_cover_v2.fig', overdue: true,
        comments: ['Куратор: поправить контраст заголовка на обложке']
      },
      {
        id: 3, title: 'Урок 3.1: Деплой бота на VPS и Railway', stage: 'editor',
        ownerRole: 'contractor', assignee: 'Мария (Редактор)', deadline: '2026-11-29',
        file: 'raw_stream_3_1.mov', overdue: false,
        comments: ['Эксперт: вырезать паузу на 04:12–04:40']
      },
      {
        id: 4, title: 'Урок 3.4: Настройка RLS политик в Supabase', stage: 'expert',
        ownerRole: 'expert', assignee: 'Анна (Эксперт)', deadline: '2026-11-24',
        file: 'tz_lesson_3_4.docx', overdue: true,
        comments: ['Админ: просрочено на 2 дня, ждём запись скринкаста!']
      },
      {
        id: 5, title: 'Урок 4.2: Упаковка кейса для биржи', stage: 'methodist',
        ownerRole: 'curator', assignee: 'Елена (Методист)', deadline: '2026-12-01',
        file: 'draft_structure.md', overdue: false,
        comments: ['Куратор: добавить чек-лист вопросов клиенту']
      }
    ];

    let tasks = JSON.parse(localStorage.getItem('eduflow_tasks') || 'null') || INITIAL_TASKS;
    let currentRole = 'admin';

    function save() { localStorage.setItem('eduflow_tasks', JSON.stringify(tasks)); }

    function visibleTasks() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      return tasks.filter(t => {
        const roleOk = currentRole === 'admin' || currentRole === 'curator' || t.ownerRole === currentRole;
        const qOk = !q || t.title.toLowerCase().includes(q) || t.assignee.toLowerCase().includes(q);
        return roleOk && qOk;
      });
    }

    function renderStats(list) {
      const overdue = list.filter(t => t.overdue).length;
      const done = list.filter(t => t.stage === 'prod').length;
      document.getElementById('statsBar').innerHTML = `
        <div class="stat">Всего доступно уроков<strong>${list.length}</strong></div>
        <div class="stat">Готово к публикации<strong>${done}</strong></div>
        <div class="stat">Просрочено дедлайнов<strong style="color:${overdue ? '#fca5a5' : '#6ee7b7'}">${overdue}</strong></div>
        <div class="stat">Уведомления Telegram<strong>Вкл (@eduflow_notify_bot)</strong></div>
      `;
    }

    function moveStage(id, dir) {
      const t = tasks.find(x => x.id === id);
      const idx = STAGES.findIndex(s => s.id === t.stage);
      const next = idx + dir;
      if (next >= 0 && next < STAGES.length) {
        t.stage = STAGES[next].id;
        t.comments.push(`Система: этап изменён на «${STAGES[next].name}» (уведомление в TG отправлено)`);
        save(); render();
      }
    }

    function openCard(id) {
      const t = tasks.find(x => x.id === id);
      document.getElementById('modalTitle').textContent = t.title;
      document.getElementById('modalBody').innerHTML = `
        <div style="font-size:13px;color:var(--muted)">Исполнитель: <b style="color:var(--text)">${t.assignee}</b> • Дедлайн: <b style="color:var(--text)">${t.deadline}</b></div>
        <div style="font-size:13px;color:var(--muted)">Вложение: <b style="color:#a5b4fc">${t.file}</b></div>
        <div class="comments">${t.comments.map(c => `<div class="comment">${c}</div>`).join('')}</div>
        <div style="display:flex;gap:8px;">
          <input id="newComment" style="flex:1" placeholder="Добавить комментарий к уроку..." />
          <button onclick="addComment(${t.id})">Отправить</button>
        </div>
      `;
      document.getElementById('modalBg').classList.add('open');
    }

    window.addComment = function(id) {
      const inp = document.getElementById('newComment');
      if (!inp.value.trim()) return;
      const t = tasks.find(x => x.id === id);
      t.comments.push(`${document.getElementById('roleSelect').selectedOptions[0].text.split(' ')[0]}: ${inp.value.trim()}`);
      save(); openCard(id); render();
    };

    function render() {
      const list = visibleTasks();
      renderStats(list);
      const board = document.getElementById('board');
      board.innerHTML = '';
      STAGES.forEach((stage, sIdx) => {
        const colTasks = list.filter(t => t.stage === stage.id);
        const col = document.createElement('section');
        col.className = 'col';
        col.innerHTML = `
          <div class="col-head"><span>${stage.name}</span><span class="badge">${colTasks.length}</span></div>
          <div class="col-body"></div>
        `;
        const body = col.querySelector('.col-body');
        colTasks.forEach(t => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-title">${t.title}</div>
            <div>
              <span class="tag">${t.assignee}</span>
              ${t.overdue ? '<span class="tag overdue">Просрочен</span>' : ''}
            </div>
            <div class="card-meta"><span>📎 ${t.file.split(' ')[0]}</span><span>📅 ${t.deadline}</span></div>
            <div class="card-actions">
              ${sIdx > 0 ? `<button class="ghost" onclick="event.stopPropagation();moveStage(${t.id},-1)">← Назад</button>` : ''}
              ${sIdx < STAGES.length - 1 ? `<button onclick="event.stopPropagation();moveStage(${t.id},1)">Далее →</button>` : ''}
            </div>
          `;
          card.onclick = () => openCard(t.id);
          body.appendChild(card);
        });
        board.appendChild(col);
      });
    }

    document.getElementById('roleSelect').onchange = e => {
      currentRole = e.target.value;
      document.getElementById('roleBadge').textContent = 'Роль: ' + e.target.selectedOptions[0].text.split(' (')[0];
      render();
    };
    document.getElementById('searchInput').oninput = render;
    document.getElementById('closeModal').onclick = () => document.getElementById('modalBg').classList.remove('open');
    document.getElementById('addBtn').onclick = () => {
      const title = prompt('Название нового урока:');
      if (!title) return;
      tasks.unshift({
        id: Date.now(), title, stage: 'methodist', ownerRole: 'expert',
        assignee: 'Анна (Эксперт)', deadline: '2026-12-05', file: 'new_brief.docx',
        overdue: false, comments: ['Создано через EduFlow']
      });
      save(); render();
    };
    render();
  </script>
</body>
</html>
